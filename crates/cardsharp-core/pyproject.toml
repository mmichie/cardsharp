[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cardsharp-core"
version = "0.1.0"
description = "Rust fast core for the cardsharp blackjack simulator"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "cardsharp_core"
# `python` is what compiles the PyO3 boundary at all -- it is off by
# default in Cargo.toml so Rust consumers link no libpython, and THIS is
# the line that turns it back on for the wheel. `extension-module` implies
# it, but both are named so the wiring is legible from either file.
# The gpu feature compiles the wgpu backend into every build; whether a
# usable adapter exists is a runtime question (cardsharp_core.gpu_probe).
features = ["python", "extension-module", "gpu"]
