# Build and publish the pure-Python `cardsharp` package to PyPI.
#
# cardsharp is platform-independent (a py3-none-any wheel + sdist); the Rust
# fast core ships separately as cardsharp-core (see release-core.yml). Fires
# on `v*` tags (e.g. v0.8.0). Publishing uses PyPI Trusted Publishing (OIDC):
# no API tokens. See RELEASING.md.
name: Release cardsharp

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build dists on demand without publishing

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build --sdist --wheel --out-dir dist
      - name: Check the tag matches the package version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          pkg=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag does not match pyproject version $pkg"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    environment: pypi # gate: configure required reviewers in repo settings
    permissions:
      id-token: write # OIDC for Trusted Publishing -- no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
