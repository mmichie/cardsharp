[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Hang guard: full-suite runs have deadlocked twice (macOS fork flake in
# multiprocessing-under-xdist), sitting silent forever. The ceiling must
# clear the slowest legitimate test everywhere it runs: a 3-deck solver
# test takes ~7 minutes solo on Apple Silicon and several times that on
# CI runners, hence 30 minutes. The thread method kills the whole worker
# on timeout, which xdist reports as a crashed worker naming the test.
timeout = 1800
timeout_method = thread
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -xvs --ignore=examples/event_cleanup_demo.py --ignore=tests/integration/test_system_integration.py
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.plugin
    ignore::UserWarning:pytest_asyncio.plugin
    ignore::pytest.PytestDeprecationWarning

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    strategy: marks tests that validate strategy decisions
    blackjack: marks tests for blackjack-specific scenarios
    split: marks tests for split scenarios
    surrender: marks tests for surrender scenarios
    debug: marks tests for debugging with full logging
    benchmark: marks tests as performance benchmarks